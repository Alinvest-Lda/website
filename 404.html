.error-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.error-links a{display:inline-flex;padding:13px 18px;border-radius:999px;text-decoration:none;font:700 13px Manrope,sans-serif;background:#061833;color:#fff}
